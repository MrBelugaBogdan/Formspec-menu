<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>MultiCraft Formspec Builder</title>
  <link rel="icon" type="image/png" href="favicon.png">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/blueimp-md5/2.19.0/js/md5.min.js"></script>
  <style>
    * { box-sizing: border-box; font-family: 'Segoe UI', Arial, sans-serif; margin: 0; padding: 0; }
    body { background: #121216; color: #fff; display: flex; flex-direction: column; height: 100vh; height: 100dvh; overflow: hidden; touch-action: none; }

    #auth-screen { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; background: #0c0c10; text-align: center; padding: 20px; }
    #auth-screen h2 { color: #0fc5f7; font-size: 24px; margin-bottom: 8px; }
    #auth-screen p { color: #888; font-size: 14px; margin-bottom: 15px; }
    #auth-screen input { padding: 12px; border-radius: 8px; border: 1px solid #333; background: #1a1a22; color: #fff; width: 100%; max-width: 280px; text-align: center; font-size: 16px; margin-bottom: 12px; outline: none; }
    #auth-screen input:focus { border-color: #0fc5f7; }
    #auth-screen button { padding: 12px 24px; border-radius: 8px; border: none; background: #0fc5f7; color: #000; font-weight: bold; cursor: pointer; font-size: 15px; transition: 0.2s; width: 100%; max-width: 280px; }
    #auth-screen button:hover { background: #38d6ff; }

    #app { display: none; flex-direction: column; height: 100vh; height: 100dvh; }
    header { background: #16161e; padding: 10px 15px; border-bottom: 2px solid #0fc5f7; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; }
    header h1 { font-size: 16px; color: #0fc5f7; }
    
    .version-selector { display: flex; align-items: center; gap: 8px; font-size: 12px; }
    .version-selector select { background: #1a1a24; color: #0fc5f7; border: 1px solid #0fc5f7; padding: 4px 8px; border-radius: 5px; font-weight: bold; outline: none; }

    .main-layout { display: flex; flex: 1; overflow: hidden; position: relative; }

    .sidebar, .properties { width: 240px; background: #1a1a24; padding: 12px; overflow-y: auto; z-index: 10; flex-shrink: 0; }
    .sidebar { border-right: 1px solid #2a2a36; }
    .properties { border-left: 1px solid #2a2a36; }

    .sidebar h3, .properties h3 { font-size: 11px; text-transform: uppercase; color: #777; margin-bottom: 8px; letter-spacing: 0.5px; }
    .btn-add { width: 100%; padding: 10px; background: #252533; color: #eee; border: 1px solid #343446; border-radius: 6px; cursor: pointer; text-align: left; font-size: 12px; font-weight: 500; margin-bottom: 6px; transition: 0.15s; }
    .btn-add:hover { background: #0fc5f7; color: #000; border-color: #0fc5f7; }

    .canvas-container { flex: 1; background: #0e0e12; display: flex; justify-content: center; align-items: center; padding: 10px; overflow: auto; position: relative; }
    .gui-box { width: 400px; height: 320px; min-width: 400px; min-height: 320px; background: #2c2c36 url('https://raw.githubusercontent.com/minetest/minetest_game/master/mods/default/textures/gui_formbg.png') repeat; border: 4px solid #444; position: relative; border-radius: 6px; box-shadow: 0 12px 35px rgba(0,0,0,0.7); touch-action: none; }

    .gui-el { position: absolute; border: 2px dashed #0fc5f7; color: #fff; display: flex; align-items: center; justify-content: center; font-size: 12px; cursor: move; user-select: none; -webkit-user-select: none; border-radius: 4px; box-sizing: border-box; text-shadow: 1px 1px 2px #000; font-weight: 600; text-align: center; word-break: break-word; padding: 2px; touch-action: none; }
    .gui-el.active { border: 2px solid #ff0055 !important; box-shadow: 0 0 10px rgba(255, 0, 85, 0.6); }

    .gui-el.type-box { border-style: solid; }
    .gui-el.type-list_player, .gui-el.type-list_chest { background: rgba(0, 180, 216, 0.2); border: 2px solid #0fc5f7; display: flex; flex-direction: column; gap: 2px; justify-content: flex-start; padding: 4px; }
    .gui-el.type-item_btn, .gui-el.type-item_img { background: rgba(0,0,0,0.4); border: 2px solid #555; border-radius: 6px; flex-direction: column; }
    
    .slot-grid-preview { display: grid; gap: 2px; width: 100%; height: 100%; pointer-events: none; }
    .slot-cell { background: rgba(0,0,0,0.5); border: 1px solid rgba(255,255,255,0.3); border-radius: 2px; }
    
    .item-id-tag { font-size: 9px; color: #0fc5f7; background: rgba(0,0,0,0.7); padding: 1px 3px; border-radius: 3px; font-family: monospace; }

    .prop-group { margin-bottom: 10px; }
    .prop-group label { display: block; font-size: 11px; color: #aaa; margin-bottom: 4px; }
    .prop-group input[type="text"], .prop-group input[type="number"] { width: 100%; padding: 7px; background: #121218; border: 1px solid #333; color: #fff; border-radius: 5px; font-size: 12px; outline: none; }
    .color-picker-row { display: flex; gap: 6px; align-items: center; }
    .color-picker-row input[type="color"] { border: none; width: 35px; height: 30px; border-radius: 4px; background: transparent; cursor: pointer; }

    .footer { background: #16161e; padding: 10px; border-top: 1px solid #2a2a36; display: flex; gap: 8px; align-items: center; }
    .footer textarea { flex: 1; height: 50px; background: #101014; border: 1px solid #333; color: #0fc5f7; padding: 8px; font-family: monospace; font-size: 11px; resize: none; border-radius: 5px; outline: none; }
    .btn-copy { background: #0fc5f7; color: #000; border: none; padding: 0 15px; height: 50px; font-weight: bold; border-radius: 5px; cursor: pointer; font-size: 13px; flex-shrink: 0; }

    @media (max-width: 850px) {
      .main-layout { flex-direction: column; overflow-y: auto; }
      .sidebar, .properties { width: 100%; border: none; border-bottom: 1px solid #2a2a36; max-height: 180px; }
      .canvas-container { min-height: 350px; overflow: auto; padding: 10px; justify-content: flex-start; align-items: flex-start; }
      .footer { flex-direction: column; }
      .footer textarea { width: 100%; height: 45px; }
      .btn-copy { width: 100%; height: 40px; }
    }
  </style>
</head>
<body>

  <div id="auth-screen">
    <h2>🔒 Вхід до Builder</h2>
    <p>Введіть секретний ключ доступу</p>
    <input type="password" id="pass-input" placeholder="Пароль..." onkeyup="if(event.key==='Enter') checkAuth()">
    <button onclick="checkAuth()">Увійти</button>
  </div>

  <div id="app">
    <header>
      <h1>🛠️ MultiCraft Formspec Builder</h1>
      <div class="version-selector">
        <label for="fv-select">Версія Formspec:</label>
        <select id="fv-select" onchange="changeVersion()">
          <option value="1">v1 (Стара)</option>
          <option value="2">v2</option>
          <option value="3">v3</option>
          <option value="4">v4</option>
          <option value="5">v5</option>
          <option value="6">v6</option>
          <option value="7" selected>v7 (Нова)</option>
        </select>
      </div>
    </header>

    <div class="main-layout">
      <div class="sidebar">
        <h3>Елементи</h3>
        <div id="sidebar-buttons"></div>
      </div>

      <div class="canvas-container">
        <div class="gui-box" id="canvas"></div>
      </div>

      <div class="properties">
        <h3>Властивості</h3>
        <div id="prop-editor">
          <p style="color: #666; font-size: 12px;">Оберіть елемент для редагування.</p>
        </div>
      </div>
    </div>

    <div class="footer">
      <textarea id="cmd-result" readonly></textarea>
      <button class="btn-copy" onclick="copyResult()">📋 Скопіювати</button>
    </div>
  </div>

  <script>
    const PASSPHRASE_HASH = "9096095f6d674a667399b067ee3df916";
    const GRID_SCALE = 40;
    let currentVersion = 7;

    const ELEMENT_TYPES = {
      label:       { minVer: 1, name: "📝 Текст (Простий)" },
      title:       { minVer: 3, name: "🎨 Текст (Форматований)" },
      list_player: { minVer: 1, name: "🎒 Інвентар Гравця" },
      list_chest:  { minVer: 1, name: "📦 Вміст Сундука (Node)" },
      item_btn:    { minVer: 1, name: "💎 Предмет-Кнопка" },
      item_img:    { minVer: 1, name: "🧱 Блок (Картинка)" },
      box:         { minVer: 1, name: "🟦 Кольоровий Квадрат" },
      field:       { minVer: 1, name: "📥 Поле вводу" },
      dropdown:    { minVer: 3, name: "📜 Випадаючий список" },
      checkbox:    { minVer: 1, name: "☑️ Чекбокс" },
      close_btn:   { minVer: 1, name: "❌ Кнопка 'Закрити'" }
    };

    function checkAuth() {
      const urlParams = new URLSearchParams(window.location.search);
      const keyFromUrl = urlParams.get('key') || "";
      const inputPass = document.getElementById('pass-input').value.trim();

      if (md5(keyFromUrl) === PASSPHRASE_HASH || md5(inputPass) === PASSPHRASE_HASH) {
        document.getElementById('auth-screen').style.display = 'none';
        document.getElementById('app').style.display = 'flex';
        updateSidebarMenu();
      } else if (inputPass !== "") {
        alert("Невірний пароль!");
      }
    }
    window.onload = checkAuth;

    function changeVersion() {
      currentVersion = parseInt(document.getElementById('fv-select').value);
      
      const beforeCount = elements.length;
      elements = elements.filter(el => {
        const config = ELEMENT_TYPES[el.type];
        return config && currentVersion >= config.minVer;
      });

      if (elements.length < beforeCount) {
        alert("Деякі елементи видалено, оскільки вони не підтримуються у v" + currentVersion);
        selectedId = null;
        renderProps();
      }

      updateSidebarMenu();
      render();
    }

    function updateSidebarMenu() {
      const container = document.getElementById('sidebar-buttons');
      container.innerHTML = '';

      for (const [key, item] of Object.entries(ELEMENT_TYPES)) {
        if (currentVersion >= item.minVer) {
          const btn = document.createElement('button');
          btn.className = 'btn-add';
          btn.innerText = item.name;
          btn.onclick = () => createEl(key);
          container.appendChild(btn);
        }
      }
    }

    let elements = [];
    let selectedId = null;

    function createEl(type) {
      const id = Date.now();
      let newEl = { 
        id, type, x: 0.5, y: 0.5, w: 2.5, h: 0.8, 
        text: "Текст", color: "#0fc5f7", item: "default:diamond", 
        key: "btn_" + id, options: "Опція 1,Опція 2",
        nodePos: "17014,443,16012"
      };
      
      if(type === 'title' || type === 'label') { newEl.w = 4; newEl.h = 0.8; newEl.text = "ЗАГОЛОВОК"; }
      if(type === 'list_player') { newEl.w = 8; newEl.h = 4; newEl.x = 0.25; newEl.y = 5.25; }
      if(type === 'list_chest') { newEl.w = 9; newEl.h = 3; newEl.x = 0.25; newEl.y = 0.5; }
      if(type === 'item_btn') { newEl.w = 1.2; newEl.h = 1.2; newEl.text = "Купити"; newEl.item = "default:diamond"; }
      if(type === 'item_img') { newEl.w = 1.2; newEl.h = 1.2; newEl.item = "default:pick_mese"; }
      if(type === 'box') { newEl.w = 3; newEl.h = 1.5; newEl.color = "#111118"; }

      elements.push(newEl);
      selectEl(id);
    }

    function selectEl(id) {
      selectedId = id;
      render();
      renderProps();
    }

    function render() {
      const canvas = document.getElementById('canvas');
      canvas.innerHTML = '';

      elements.forEach(el => {
        const div = document.createElement('div');
        div.className = `gui-el type-${el.type} ${el.id === selectedId ? 'active' : ''}`;
        
        div.style.left = (el.x * GRID_SCALE) + 'px';
        div.style.top = (el.y * GRID_SCALE) + 'px';
        div.style.width = (el.w * GRID_SCALE) + 'px';
        div.style.height = (el.h * GRID_SCALE) + 'px';

        if (el.type === 'list_player' || el.type === 'list_chest') {
          const slotsCount = Math.round(el.w) * Math.round(el.h);
          let gridHtml = '<div class="slot-grid-preview" style="grid-template-columns: repeat(' + Math.round(el.w) + ', 1fr);">';
          for(let i=0; i<slotsCount; i++) {
            gridHtml += '<div class="slot-cell"></div>';
          }
          gridHtml += '</div>';
          
          const labelText = el.type === 'list_player' ? '🎒 Інвентар' : `📦 Node: [${el.nodePos}]`;
          div.innerHTML = `<span style="font-size:10px; position:absolute; top:-16px; left:0; color:#0fc5f7;">${labelText}</span>` + gridHtml;
        } else if (el.type === 'title') {
          div.style.color = el.color;
          div.innerText = el.text;
        } else if (el.type === 'box') {
          div.style.background = el.color;
        } else if (el.type === 'item_btn' || el.type === 'item_img') {
          div.innerHTML = `
            <div style="font-size:14px;">📦</div>
            <div class="item-id-tag">${el.item}</div>
            ${el.type === 'item_btn' ? `<div style="font-size:10px; margin-top:2px;">${el.text}</div>` : ''}
          `;
        } else {
          div.innerText = el.text;
        }

        const initDrag = (e) => {
          e.stopPropagation();
          selectEl(el.id);

          const isTouch = e.type === 'touchstart';
          if (isTouch) e.preventDefault();

          const getCoords = (event) => {
            return event.touches && event.touches.length > 0
              ? { x: event.touches[0].clientX, y: event.touches[0].clientY }
              : { x: event.clientX, y: event.clientY };
          };

          const initial = getCoords(e);
          let startX = initial.x - (el.x * GRID_SCALE);
          let startY = initial.y - (el.y * GRID_SCALE);

          const doDrag = (event) => {
            if (event.cancelable) event.preventDefault();
            const current = getCoords(event);

            let newX = Math.max(0, Math.round(((current.x - startX) / GRID_SCALE) * 10) / 10);
            let newY = Math.max(0, Math.round(((current.y - startY) / GRID_SCALE) * 10) / 10);
            
            el.x = newX;
            el.y = newY;
            render();
            renderProps();
          };

          const stopDrag = () => {
            document.removeEventListener('mousemove', doDrag);
            document.removeEventListener('mouseup', stopDrag);
            document.removeEventListener('touchmove', doDrag);
            document.removeEventListener('touchend', stopDrag);
          };

          if (isTouch) {
            document.addEventListener('touchmove', doDrag, { passive: false });
            document.addEventListener('touchend', stopDrag);
          } else {
            document.addEventListener('mousemove', doDrag);
            document.addEventListener('mouseup', stopDrag);
          }
        };

        div.addEventListener('mousedown', initDrag);
        div.addEventListener('touchstart', initDrag, { passive: false });

        canvas.appendChild(div);
      });

      buildCmd();
    }

    function renderProps() {
      const editor = document.getElementById('prop-editor');
      const el = elements.find(item => item.id === selectedId);

      if (!el) {
        editor.innerHTML = '<p style="color: #666; font-size: 12px;">Нічого не обрано</p>';
        return;
      }

      let html = '';

      if (el.type === 'list_chest') {
        html += `
          <div class="prop-group">
            <label>Координати X,Y,Z (через кому):</label>
            <input type="text" value="${el.nodePos}" placeholder="17014,443,16012" oninput="updateVal('nodePos', this.value)">
          </div>
        `;
      }

      // Поле вводу предмета для item_btn та item_img
      if (el.type === 'item_btn' || el.type === 'item_img') {
        html += `
          <div class="prop-group">
            <label>ID Предмета (напр. default:diamond):</label>
            <input type="text" value="${el.item}" oninput="updateVal('item', this.value)">
          </div>
        `;
      }

      if (['title', 'label', 'field', 'item_btn', 'close_btn', 'dropdown', 'checkbox'].includes(el.type)) {
        html += `
          <div class="prop-group">
            <label>Текст / Назва:</label>
            <input type="text" value="${el.text}" oninput="updateVal('text', this.value)">
          </div>
        `;
      }

      if (el.type === 'title' || el.type === 'box') {
        html += `
          <div class="prop-group">
            <label>Колір:</label>
            <div class="color-picker-row">
              <input type="color" value="${el.color}" oninput="updateVal('color', this.value); this.nextElementSibling.value=this.value;">
              <input type="text" value="${el.color}" oninput="updateVal('color', this.value); this.previousElementSibling.value=this.value;">
            </div>
          </div>
        `;
      }

      html += `
        <div style="display:flex; gap:6px;">
          <div class="prop-group" style="flex:1;">
            <label>${el.type.startsWith('list') ? 'Слотів (W)' : 'Ширина W'}:</label>
            <input type="number" step="${el.type.startsWith('list') ? '1' : '0.1'}" value="${el.w}" onchange="updateVal('w', parseFloat(this.value))">
          </div>
          <div class="prop-group" style="flex:1;">
            <label>${el.type.startsWith('list') ? 'Рядів (H)' : 'Висота H'}:</label>
            <input type="number" step="${el.type.startsWith('list') ? '1' : '0.1'}" value="${el.h}" onchange="updateVal('h', parseFloat(this.value))">
          </div>
        </div>

        <div style="display:flex; gap:6px;">
          <div class="prop-group" style="flex:1;">
            <label>X:</label>
            <input type="number" step="0.1" value="${el.x}" onchange="updateVal('x', parseFloat(this.value))">
          </div>
          <div class="prop-group" style="flex:1;">
            <label>Y:</label>
            <input type="number" step="0.1" value="${el.y}" onchange="updateVal('y', parseFloat(this.value))">
          </div>
        </div>

        <button onclick="removeEl(${el.id})" style="background:#ff3355; color:#fff; border:none; padding:8px; width:100%; border-radius:5px; cursor:pointer; font-weight:bold; margin-top:5px; font-size:12px;">🗑️ Видалити</button>
      `;

      editor.innerHTML = html;
    }

    function updateVal(key, val) {
      const el = elements.find(item => item.id === selectedId);
      if (el) {
        el[key] = val;
        render();
      }
    }

    function removeEl(id) {
      elements = elements.filter(item => item.id !== id);
      selectedId = null;
      renderProps();
      render();
    }

    function buildCmd() {
      let code = "";

      if (currentVersion >= 3) {
        code += `formspec_version[${currentVersion}]`;
      }
      
      code += "size[12.5,12]background[0,0;12.5,12;default_item_bg.png]";

      elements.forEach(el => {
        if (el.type === 'list_chest') {
          code += "list[nodemeta:" + el.nodePos + ";main;" + el.x + "," + el.y + ";" + el.w + "," + el.h + ";]";
        } else if (el.type === 'list_player') {
          code += "list[current_player;main;" + el.x + "," + el.y + ";" + el.w + "," + el.h + ";]";
        } else if (el.type === 'label') {
          code += "label[" + el.x + "," + el.y + ";" + el.text + "]";
        } else if (el.type === 'title') {
          code += "hypertext[" + el.x + "," + el.y + ";" + el.w + "," + el.h + ";title;<global halign=center font=size=20><style color=" + el.color + "><b>" + el.text + "</b></style>]";
        } else if (el.type === 'box') {
          code += "box[" + el.x + "," + el.y + ";" + el.w + "," + el.h + ";" + el.color + "]";
        } else if (el.type === 'item_btn') {
          code += "item_image_button[" + el.x + "," + el.y + ";" + el.w + "," + el.h + ";" + el.item + ";" + el.key + ";" + el.text + "]";
        } else if (el.type === 'item_img') {
          code += "item_image[" + el.x + "," + el.y + ";" + el.w + "," + el.h + ";" + el.item + "]";
        } else if (el.type === 'field') {
          code += "field[" + el.x + "," + el.y + ";" + el.w + "," + el.h + ";" + el.key + ";" + el.text + ";]";
        } else if (el.type === 'dropdown') {
          code += "dropdown[" + el.x + "," + el.y + ";" + el.w + "," + el.h + ";" + el.key + ";" + el.options + ";1]";
        } else if (el.type === 'checkbox') {
          code += "checkbox[" + el.x + "," + el.y + ";" + el.key + ";" + el.text + ";false]";
        } else if (el.type === 'close_btn') {
          code += "button_exit[" + el.x + "," + el.y + ";" + el.w + "," + el.h + ";" + el.key + ";" + el.text + "]";
        }
      });

      const fullCmd = '/giveme books:empty 1 0 "\\u0001owner\\u0002Деси\\u0003description\\u0002Інвентар\\u0003page\\u0001\\u0003page_max\\u0001\\u0003text_b64\\u00020LPRgNCw0L/QvtC9IDIgLSDRhNC20LXRgNCwINC/0L7Qu9GMINC70ZbQstC90LAK\\u0003title_b64\\u00020JrRgNC40YHQuyBCYWc=\\u0003formspec\\u0002' + code + '\\u0003"';
      document.getElementById('cmd-result').value = fullCmd;
    }

    function copyResult() {
      const txt = document.getElementById("cmd-result");
      txt.select();
      navigator.clipboard.writeText(txt.value);
      alert("✅ Скопійовано!");
    }
  </script>
</body>
</html>
