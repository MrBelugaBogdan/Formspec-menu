<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Minetest Formspec Builder</title>
  
  <script src="https://cdnjs.cloudflare.com/ajax/libs/blueimp-md5/2.19.0/js/md5.min.js"></script>
  <script src="config.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
      user-select: none;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #0b0c10;
      color: #c5c6c7;
    }

    /* Авторизація */
    .auth-container {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background: #0b0c10;
    }

    .auth-box {
      background: #1f2833;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.7);
      text-align: center;
      border: 1px solid #45a29e;
      width: 320px;
    }

    .auth-box h2 { margin-bottom: 12px; color: #66fcf1; font-size: 20px; }
    .auth-box p { margin-bottom: 18px; font-size: 13px; color: #c5c6c7; }
    .auth-box input {
      width: 100%;
      padding: 10px;
      margin-bottom: 15px;
      border-radius: 6px;
      border: 1px solid #45a29e;
      background: #0b0c10;
      color: #fff;
      outline: none;
    }
    .auth-box button {
      width: 100%;
      padding: 10px;
      background: #66fcf1;
      border: none;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
      color: #0b0c10;
    }

    /* Макет додатку */
    #app {
      display: flex;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
    }

    /* Бічні панелі зі строгим обмеженням за висотою */
    .sidebar, .properties-panel {
      width: 280px;
      min-width: 280px;
      max-height: 100vh;
      background: #1f2833;
      border-right: 1px solid #2c3540;
      padding: 15px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .properties-panel {
      border-right: none;
      border-left: 1px solid #2c3540;
    }

    h3 {
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 1.2px;
      color: #66fcf1;
      margin-bottom: 5px;
    }

    .button-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .btn-add, .btn-bg {
      padding: 8px 10px;
      background: #11141a;
      border: 1px solid #2c3540;
      color: #c5c6c7;
      border-radius: 6px;
      cursor: pointer;
      text-align: left;
      font-size: 12px;
      transition: all 0.2s;
    }

    .btn-add:hover { background: #2c3540; color: #66fcf1; border-color: #66fcf1; }
    .btn-bg { background: #2e1d38; border-color: #6b2d86; color: #e0b0ff; font-weight: bold; }
    .btn-bg:hover { background: #432554; border-color: #a855f7; }

    /* Центральна частина редактора */
    .editor-area {
      flex: 1;
      display: flex;
      flex-direction: column;
      height: 100vh;
      background: #0b0c10;
      overflow: hidden;
    }

    .canvas-header {
      padding: 10px 15px;
      background: #14171d;
      border-bottom: 1px solid #1f2833;
      font-size: 12px;
      color: #66fcf1;
      font-weight: bold;
      flex-shrink: 0;
    }

    /* Зона скролінгу полотна */
    #canvas-container {
      flex: 1;
      overflow: auto;
      padding: 20px;
      display: flex;
      justify-content: center;
      align-items: center;
      background-image: radial-gradient(#1f2833 1px, transparent 1px);
      background-size: 20px 20px;
    }

    /* Полотно (Canvas) з динамiчним розмiром */
    #canvas {
      position: relative;
      background: #14171d;
      border: 2px dashed #45a29e;
      border-radius: 6px;
      box-shadow: 0 0 25px rgba(0,0,0,0.8);
      transition: width 0.1s, height 0.1s;
    }

    /* Елементи GUI */
    .gui-el {
      position: absolute;
      border: 1px dashed rgba(255,255,255,0.3);
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      color: #fff;
      cursor: move;
      overflow: hidden;
      text-align: center;
      word-break: break-all;
      border-radius: 3px;
    }

    .gui-el.active {
      border: 2px solid #66fcf1 !important;
      box-shadow: 0 0 10px rgba(102, 252, 241, 0.5);
      z-index: 1000 !important;
    }

    .gui-el.type-bg_custom { z-index: 1; border: none; }
    .gui-el.type-box { z-index: 2; }
    .gui-el.type-list_chest, .gui-el.type-list_player {
      background: rgba(69, 162, 158, 0.1);
      border: 1px solid #45a29e;
    }

    .slot-grid-preview {
      display: grid;
      width: 100%;
      height: 100%;
      gap: 2px;
      padding: 2px;
    }

    .slot-cell {
      background: rgba(0, 0, 0, 0.6);
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 2px;
    }

    .item-id-tag {
      background: #000;
      padding: 2px 4px;
      border-radius: 3px;
      font-family: monospace;
      font-size: 9px;
      color: #66fcf1;
      margin-top: 2px;
    }

    /* Властивості */
    .prop-group {
      display: flex;
      flex-direction: column;
      gap: 4px;
      margin-bottom: 8px;
    }

    .prop-group label { font-size: 10px; color: #8892b0; }

    .prop-group input, .prop-group select {
      padding: 6px;
      background: #0b0c10;
      border: 1px solid #2c3540;
      color: #fff;
      border-radius: 4px;
      font-size: 11px;
      outline: none;
    }

    .prop-group input:focus, .prop-group select:focus { border-color: #66fcf1; }
    .color-picker-row { display: flex; gap: 6px; }

    .color-picker-row input[type="color"] {
      width: 32px;
      height: 28px;
      padding: 0;
      cursor: pointer;
    }

    .layer-controls { display: flex; gap: 5px; margin-top: 2px; }

    .btn-layer {
      flex: 1;
      padding: 6px;
      background: #11141a;
      border: 1px solid #2c3540;
      color: #c5c6c7;
      font-size: 10px;
      border-radius: 4px;
      cursor: pointer;
    }
    .btn-layer:hover { background: #2c3540; color: #fff; }

    /* Поле виводу знизу */
    .output-area {
      padding: 10px 15px;
      background: #14171d;
      border-top: 1px solid #1f2833;
      flex-shrink: 0;
    }

    .output-area label {
      display: block;
      font-size: 10px;
      color: #8892b0;
      margin-bottom: 4px;
    }

    .output-row { display: flex; gap: 8px; }

    #cmd-result {
      flex: 1;
      height: 40px;
      background: #0b0c10;
      border: 1px solid #2c3540;
      color: #66fcf1;
      font-family: monospace;
      font-size: 11px;
      padding: 6px;
      border-radius: 4px;
      resize: none;
      outline: none;
    }

    .output-row button {
      padding: 0 14px;
      background: #66fcf1;
      border: none;
      border-radius: 4px;
      font-weight: bold;
      cursor: pointer;
      color: #0b0c10;
    }
  </style>
</head>
<body>

  <!-- Авторизація -->
  <div id="auth-screen" class="auth-container">
    <div class="auth-box">
      <h2>🔒 Вхід у систему</h2>
      <p>Введіть пароль для доступу до конструктора:</p>
      <input type="password" id="pass-input" placeholder="Пароль..." onkeypress="if(event.key==='Enter') checkAuth()">
      <button onclick="checkAuth()">Увійти</button>
    </div>
  </div>

  <!-- Головний додаток -->
  <div id="app" style="display: none;">
    <div class="sidebar">
      <h3>🧩 Елементи</h3>
      
      <div class="prop-group">
        <label for="fv-select">Версія Formspec:</label>
        <select id="fv-select" onchange="changeVersion()">
          <option value="1">v1 (Стара)</option>
          <option value="3">v3</option>
          <option value="4">v4</option>
          <option value="5">v5</option>
          <option value="6">v6</option>
          <option value="7" selected>v7 (Сучасна)</option>
        </select>
      </div>

      <div id="sidebar-buttons" class="button-list"></div>
    </div>

    <div class="editor-area">
      <div class="canvas-header">🎨 Полотно Formspec</div>
      <div id="canvas-container">
        <div id="canvas"></div>
      </div>
      
      <div class="output-area">
        <label for="cmd-result">Готова команда / Formspec код:</label>
        <div class="output-row">
          <textarea id="cmd-result" readonly></textarea>
          <button onclick="copyResult()">📋 Копіювати</button>
        </div>
      </div>
    </div>

    <div class="properties-panel">
      <h3>⚙️ Властивості</h3>
      <div id="prop-editor">
        <p style="color: #666; font-size: 11px;">Нічого не обрано</p>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
