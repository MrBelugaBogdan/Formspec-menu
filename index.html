<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MultiCraft Formspec Builder</title>
  <style>
    * { box-sizing: border-box; font-family: Arial, sans-serif; margin: 0; padding: 0; }
    body { background: #18181c; color: #fff; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }

    /* Екран авторизації */
    #auth-screen { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; background: #111116; text-align: center; }
    #auth-screen input { padding: 10px; border-radius: 6px; border: 1px solid #444; background: #222; color: #fff; margin-top: 10px; width: 250px; text-align: center; }
    #auth-screen button { padding: 10px 20px; border-radius: 6px; border: none; background: #0fc5f7; font-weight: bold; cursor: pointer; margin-top: 10px; }

    /* Основний інтерфейс */
    #app { display: none; flex-direction: column; height: 100vh; }
    header { background: #111116; padding: 12px 20px; border-bottom: 2px solid #0fc5f7; display: flex; justify-content: space-between; align-items: center; }
    header h1 { font-size: 18px; color: #0fc5f7; }

    .main-layout { display: flex; flex: 1; overflow: hidden; }

    /* Ліва панель */
    .sidebar { width: 240px; background: #22222a; padding: 15px; border-right: 1px solid #333; }
    .sidebar h3 { font-size: 13px; text-transform: uppercase; color: #888; margin-bottom: 12px; }
    .btn-add { width: 100%; padding: 10px; margin-bottom: 8px; background: #333340; color: #fff; border: 1px solid #444; border-radius: 6px; cursor: pointer; text-align: left; }
    .btn-add:hover { background: #0fc5f7; color: #000; font-weight: bold; }

    /* Полотно GUI (Canvas) */
    .canvas-container { flex: 1; background: #141418; display: flex; justify-content: center; align-items: center; padding: 20px; }
    .gui-box { width: 500px; height: 400px; background: #2c2c35; border: 4px solid #444; position: relative; border-radius: 6px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }

    /* Елементи на полотні */
    .gui-el { position: absolute; background: rgba(15, 197, 247, 0.25); border: 2px dashed #0fc5f7; color: #fff; display: flex; align-items: center; justify-content: center; font-size: 12px; cursor: move; user-select: none; border-radius: 4px; box-sizing: border-box; }
    .gui-el.active { border: 2px solid #ff0055; background: rgba(255, 0, 85, 0.3); }

    /* Права панель */
    .properties { width: 260px; background: #22222a; padding: 15px; border-left: 1px solid #333; }
    .prop-group { margin-bottom: 12px; }
    .prop-group label { display: block; font-size: 12px; color: #aaa; margin-bottom: 4px; }
    .prop-group input { width: 100%; padding: 8px; background: #141418; border: 1px solid #444; color: #fff; border-radius: 4px; }

    /* Нижня панель копіювання */
    .footer { background: #111116; padding: 12px 20px; border-top: 1px solid #333; display: flex; gap: 10px; align-items: center; }
    .footer textarea { flex: 1; height: 50px; background: #18181c; border: 1px solid #444; color: #0fc5f7; padding: 8px; font-family: monospace; font-size: 11px; resize: none; border-radius: 4px; }
    .btn-copy { background: #0fc5f7; color: #000; border: none; padding: 0 25px; height: 50px; font-weight: bold; border-radius: 4px; cursor: pointer; font-size: 14px; }
    .btn-copy:hover { background: #029ec8; }
  </style>
</head>
<body>

  <!-- Захист паролем -->
  <div id="auth-screen">
    <h2 style="color: #0fc5f7;">🔒 Вхід для розробників</h2>
    <p style="color: #888; margin-top: 5px; font-size: 14px;">Введіть секретний ключ для доступу</p>
    <input type="password" id="pass-input" placeholder="Пароль...">
    <button onclick="checkAuth()">Увійти</button>
  </div>

  <!-- Конструктор -->
  <div id="app">
    <header>
      <h1>🛠️ MultiCraft Formspec Builder</h1>
      <span style="font-size: 12px; color: #888;">Для книг / блоків</span>
    </header>

    <div class="main-layout">
      <div class="sidebar">
        <h3>Додати елемент</h3>
        <button class="btn-add" onclick="createEl('title')">📝 Заголовок</button>
        <button class="btn-add" onclick="createEl('item_btn')">💎 Предмет-Кнопка</button>
        <button class="btn-add" onclick="createEl('field')">📥 Поле вводу</button>
        <button class="btn-add" onclick="createEl('close_btn')">❌ Кнопка "Закрити"</button>
      </div>

      <div class="canvas-container">
        <div class="gui-box" id="canvas"></div>
      </div>

      <div class="properties">
        <h3 style="margin-bottom: 15px;">Налаштування</h3>
        <div id="prop-editor">
          <p style="color: #666; font-size: 13px;">Клікни на елемент для редагування</p>
        </div>
      </div>
    </div>

    <div class="footer">
      <textarea id="cmd-result" readonly></textarea>
      <button class="btn-copy" onclick="copyResult()">📋 Копіювати команду</button>
    </div>
  </div>

  <script>
    // ЗМІНИ ПАРОЛЬ ТУТ (за замовчуванням: 1234)
    const SECRET_KEY = "1234";

    // Перевірка доступу (включаючи доступ за посиланням типу ?key=1234)
    function checkAuth() {
      const urlParams = new URLSearchParams(window.location.search);
      const keyFromUrl = urlParams.get('key');
      const inputPass = document.getElementById('pass-input').value;

      if (keyFromUrl === SECRET_KEY || inputPass === SECRET_KEY) {
        document.getElementById('auth-screen').style.display = 'none';
        document.getElementById('app').style.display = 'flex';
      } else if (inputPass !== "") {
        alert("Невірний пароль!");
      }
    }
    window.onload = checkAuth;

    // Логіка конструктора
    let elements = [];
    let selectedId = null;

    function createEl(type) {
      const id = Date.now();
      let newEl = { id, type, x: 1, y: 1, w: 3, h: 1, text: "Текст", item: "default:diamond", key: "btn_" + id };
      
      if(type === 'title') { newEl.w = 8; newEl.text = "МАГАЗИН"; }
      if(type === 'item_btn') { newEl.w = 1.5; newEl.h = 1.5; newEl.text = "Купити"; }

      elements.push(newEl);
      selectEl(id);
    }

    function selectEl(id) {
      selectedId = id;
      render();
      renderProps();
    }

    function render() {
      const canvas = document.getElementById('canvas');
      canvas.innerHTML = '';

      elements.forEach(el => {
        const div = document.createElement('div');
        div.className = `gui-el ${el.id === selectedId ? 'active' : ''}`;
        
        // 1 одиниця Formspec = 50 пікселів на екрані
        div.style.left = (el.x * 50) + 'px';
        div.style.top = (el.y * 50) + 'px';
        div.style.width = (el.w * 50) + 'px';
        div.style.height = (el.h * 50) + 'px';

        div.innerText = el.type === 'item_btn' ? `[${el.item}]` : el.text;

        // Перетягування мишкою (Drag and Drop)
        div.onmousedown = function(e) {
          e.stopPropagation();
          selectEl(el.id);

          let startX = e.clientX - (el.x * 50);
          let startY = e.clientY - (el.y * 50);

          function onMouseMove(e) {
            let newX = Math.max(0, Math.round((e.clientX - startX) / 25) * 0.5);
            let newY = Math.max(0, Math.round((e.clientY - startY) / 25) * 0.5);
            el.x = newX;
            el.y = newY;
            render();
            renderProps();
          }

          document.addEventListener('mousemove', onMouseMove);
          document.onmouseup = function() {
            document.removeEventListener('mousemove', onMouseMove);
            document.onmouseup = null;
          };
        };

        canvas.appendChild(div);
      });

      buildCmd();
    }

    function renderProps() {
      const editor = document.getElementById('prop-editor');
      const el = elements.find(item => item.id === selectedId);

      if (!el) {
        editor.innerHTML = '<p style="color: #666; font-size: 13px;">Нічого не обрано</p>';
        return;
      }

      editor.innerHTML = `
        <div class="prop-group">
          <label>Текст / Назва:</label>
          <input type="text" value="${el.text}" oninput="updateVal('text', this.value)">
        </div>
        ${el.type === 'item_btn' ? `
        <div class="prop-group">
          <label>Предмет (ID):</label>
          <input type="text" value="${el.item}" oninput="updateVal('item', this.value)">
        </div>` : ''}
        <div class="prop-group">
          <label>Позиція X:</label>
          <input type="number" step="0.5" value="${el.x}" onchange="updateVal('x', parseFloat(this.value))">
        </div>
        <div class="prop-group">
          <label>Позиція Y:</label>
          <input type="number" step="0.5" value="${el.y}" onchange="updateVal('y', parseFloat(this.value))">
        </div>
        <button onclick="removeEl(${el.id})" style="background:#ff3355; color:#fff; border:none; padding:8px; width:100%; border-radius:4px; cursor:pointer; margin-top:10px;">🗑️ Видалити</button>
      `;
    }

    function updateVal(key, val) {
      const el = elements.find(item => item.id === selectedId);
      if (el) {
        el[key] = val;
        render();
      }
    }

    function removeEl(id) {
      elements = elements.filter(item => item.id !== id);
      selectedId = null;
      renderProps();
      render();
    }

    // Генерація команди
    function buildCmd() {
      let code = "formspec_version[7]size[10,8]background[-0.5,-0.5;11,9;gui_formbg.png;true]";

      elements.forEach(el => {
        if (el.type === 'title') {
          code += `hypertext[${el.x},${el.y};${el.w},${el.h};title;<global halign=center font=size=20><style color=#0fc5f7><b>${el.text}</b></style>]`;
        } else if (el.type === 'item_btn') {
          code += `item_image_button[${el.x},${el.y};${el.w},${el.h};${el.item};${el.key};${el.text}]`;
        } else if (el.type === 'field') {
          code += `field[${el.x},${el.y};${el.w},${el.h};${el.key};${el.text};1]`;
        } else if (el.type === 'close_btn') {
          code += `button_exit[${el.x},${el.y};${el.w},${el.h};${el.key};${el.text}]`;
        }
      });

      const fullCmd = `/giveme books:empty 1 0 "\\u0001formspec\\u0002${code}\\u0003"`;
      document.getElementById('cmd-result').value = fullCmd;
    }

    function copyResult() {
      const txt = document.getElementById("cmd-result");
      txt.select();
      navigator.clipboard.writeText(txt.value);
      alert("✅ Команду скопійовано! Вставляй її в гру.");
    }
  </script>
</body>
</html>
